# XcodeGen spec: the same app plus a UI-test bundle (for touch-driven captures).
name: Probe
options:
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: "NO"
    DEVELOPMENT_TEAM: ""
targets:
  Probe:
    type: application
    platform: iOS
    sources: [App.swift]
    settings:
      base:
        PRODUCT_NAME: Probe
        PRODUCT_BUNDLE_IDENTIFIER: dev.probe.liquidglass
        INFOPLIST_FILE: Info.plist
  ProbeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests.swift]
    dependencies:
      - target: Probe
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.probe.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Probe
schemes:
  Probe:
    build:
      targets:
        Probe: all
        ProbeUITests: [test]
    test:
      targets: [ProbeUITests]
