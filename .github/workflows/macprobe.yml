name: macprobe
on:
  push:
    branches: [main]
    paths: ['macprobe/**', '.github/workflows/macprobe*.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: macprobe
  cancel-in-progress: false

jobs:
  macprobe:
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Environment
        run: |
          OUT="$RUNNER_TEMP/out"
          B="$RUNNER_TEMP/b"
          echo "OUT=$OUT" >> "$GITHUB_ENV"
          echo "B=$B" >> "$GITHUB_ENV"
          mkdir -p "$OUT" "$B"
          { sw_vers; xcodebuild -version; uname -m; system_profiler SPDisplaysDataType | head -30; } | tee "$OUT/env.txt"
      - name: Build (one binary per scene file)
        run: bash macprobe/build.sh
      - name: Run the plan
        run: bash macprobe/run.sh macprobe/plan.txt
      # Results go to the orphan branch results-mac (force-pushed each run), so they
      # can be fetched with plain git, no API token needed.
      - name: Publish results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --orphan results-mac
          cp -R "$OUT/." .
          git add -A
          git commit -q -m "run ${{ github.run_id }} from ${{ github.sha }}"
          git push -f origin results-mac
