name: probe
on:
  push:
    branches: [main]
    paths: ['probe/**', '.github/workflows/probe.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      # The runner context is not available in job-level env, so set paths here.
      - name: Environment
        run: |
          OUT="$RUNNER_TEMP/out"
          echo "OUT=$OUT" >> "$GITHUB_ENV"
          echo "APP=$RUNNER_TEMP/Probe.app" >> "$GITHUB_ENV"
          mkdir -p "$OUT"
          { sw_vers; xcodebuild -version; xcrun simctl list runtimes; } | tee "$OUT/env.txt"
      - name: Install idb (touch injection for the press capture)
        continue-on-error: true
        timeout-minutes: 10
        run: |
          brew tap facebook/fb > "$OUT/idb-install.txt" 2>&1
          brew trust facebook/fb >> "$OUT/idb-install.txt" 2>&1 || true
          brew install idb-companion >> "$OUT/idb-install.txt" 2>&1
          pip3 install --break-system-packages fb-idb > /dev/null
          idb --help > /dev/null && echo "idb ok" | tee "$OUT/idb-install.txt"
          which idb idb_companion >> "$OUT/idb-install.txt" 2>&1 || true
      - name: Build
        run: bash probe/build.sh
      - name: Build UI tests (XcodeGen + xcodebuild)
        continue-on-error: true
        timeout-minutes: 15
        run: |
          brew install xcodegen > "$OUT/uitest-build.txt" 2>&1
          cd probe && xcodegen generate --spec project.yml >> "$OUT/uitest-build.txt" 2>&1
          xcodebuild build-for-testing -project Probe.xcodeproj -scheme Probe             -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/dd"             >> "$OUT/uitest-build.txt" 2>&1 && echo "uitests built" | tee -a "$OUT/uitest-build.txt"
          tail -30 "$OUT/uitest-build.txt"
      - name: Capture
        timeout-minutes: 22
        run: bash probe/capture.sh
      # Results go to the orphan branch `results` (force-pushed each run), so they
      # can be fetched with plain git, no API token needed.
      - name: Publish results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --orphan results
          cp -R "$OUT/." .
          git add -A
          git commit -q -m "run ${{ github.run_id }} from ${{ github.sha }}"
          git push -f origin results
